<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>鋸片診療系統</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f9;
        --card: #ffffff;
        --text: #1b1b1f;
        --muted: #5f6368;
        --accent: #2b6cb0;
        --border: #e0e0e5;
        --warning: #c05621;
        --success: #2f855a;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1115;
          --card: #171a21;
          --text: #f2f2f2;
          --muted: #a0a4ad;
          --accent: #63b3ed;
          --border: #2a2f3a;
          --warning: #f6ad55;
          --success: #68d391;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }

      header {
        padding: 2.5rem 1.5rem 1rem;
        text-align: center;
      }

      header h1 {
        margin: 0 0 0.35rem;
        font-size: clamp(1.75rem, 2vw + 1rem, 2.6rem);
      }

      header p {
        margin: 0 auto;
        max-width: 42rem;
        color: var(--muted);
      }

      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 1.5rem;
        display: grid;
        gap: 1.25rem;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1.5rem;
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
      }

      .card h2 {
        margin-top: 0;
        font-size: 1.2rem;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.35rem 0.75rem;
        background: rgba(43, 108, 176, 0.12);
        color: var(--accent);
        border-radius: 999px;
        font-size: 0.85rem;
        font-weight: 600;
      }

      .grid {
        display: grid;
        gap: 0.85rem;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        font-size: 0.9rem;
      }

      input[type="text"],
      input[type="number"],
      input[type="date"],
      select {
        border-radius: 0.65rem;
        border: 1px solid var(--border);
        padding: 0.6rem 0.75rem;
        font-size: 1rem;
        background: transparent;
        color: inherit;
      }

      textarea {
        width: 100%;
        min-height: 140px;
        border-radius: 0.75rem;
        border: 1px solid var(--border);
        padding: 0.75rem;
        font-size: 1rem;
        background: transparent;
        color: inherit;
        resize: vertical;
      }

      .symptoms {
        display: grid;
        gap: 0.6rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .symptoms li {
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }

      .symptoms input[type="checkbox"] {
        width: 1.1rem;
        height: 1.1rem;
        accent-color: var(--accent);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 0.75rem;
      }

      button {
        border: none;
        background: var(--accent);
        color: #fff;
        padding: 0.6rem 1rem;
        border-radius: 999px;
        font-weight: 600;
        cursor: pointer;
      }

      button.secondary {
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--accent);
      }

      .diagnosis {
        display: grid;
        gap: 0.6rem;
      }

      .diagnosis .item {
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        border: 1px dashed var(--border);
        background: rgba(47, 133, 90, 0.08);
      }

      .diagnosis .item.warning {
        background: rgba(192, 86, 33, 0.12);
        border-color: rgba(192, 86, 33, 0.4);
      }

      footer {
        text-align: center;
        padding: 1rem 1.5rem 2rem;
        color: var(--muted);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="pill">離線可用 · 單一檔案 · 手機友善</div>
      <h1>鋸片診療系統</h1>
      <p>
        這是一個用來快速紀錄鋸片狀態、症狀與建議處置方式的工具。所有資料都保存在本機，
        方便現場維修或與同事分享。
      </p>
    </header>

    <main>
      <section class="card">
        <h2>鋸片基本資料</h2>
        <div class="grid">
          <label>鋸片型號
            <input id="bladeModel" type="text" placeholder="例：SB-305" />
          </label>
          <label>直徑 (mm)
            <input id="diameter" type="number" min="0" step="1" placeholder="305" />
          </label>
          <label>齒數
            <input id="teeth" type="number" min="0" step="1" placeholder="60" />
          </label>
          <label>使用材質
            <input id="material" type="text" placeholder="例：鋁材" />
          </label>
          <label>使用工時 (小時)
            <input id="hours" type="number" min="0" step="1" placeholder="120" />
          </label>
          <label>最近維修日期
            <input id="serviceDate" type="date" />
          </label>
        </div>
      </section>

      <section class="card">
        <h2>現場症狀</h2>
        <ul class="symptoms">
          <li><label><input type="checkbox" data-symptom="vibration" />切割震動或偏擺</label></li>
          <li><label><input type="checkbox" data-symptom="burn" />切割面有燒焦或冒煙</label></li>
          <li><label><input type="checkbox" data-symptom="chip" />齒尖崩裂或斷齒</label></li>
          <li><label><input type="checkbox" data-symptom="slow" />切不動／進給變慢</label></li>
          <li><label><input type="checkbox" data-symptom="noise" />異音明顯</label></li>
        </ul>
      </section>

      <section class="card">
        <h2>機台與切削參數</h2>
        <div class="grid">
          <label>主軸轉速 (RPM)
            <input id="rpm" type="number" min="0" step="1" placeholder="3200" />
          </label>
          <label>進給速度 (mm/min)
            <input id="feed" type="number" min="0" step="1" placeholder="1200" />
          </label>
          <label>冷卻方式
            <select id="cooling">
              <option value="dry">乾式</option>
              <option value="mist">微量噴霧</option>
              <option value="wet">水溶性冷卻</option>
            </select>
          </label>
          <label>夾持狀態
            <select id="clamp">
              <option value="stable">穩定</option>
              <option value="loose">鬆動</option>
              <option value="unknown">不確定</option>
            </select>
          </label>
        </div>
      </section>

      <section class="card">
        <h2>診斷建議</h2>
        <div class="diagnosis" id="diagnosisList"></div>
        <div class="actions">
          <button id="save">儲存</button>
          <button class="secondary" id="reset">清空</button>
        </div>
      </section>

      <section class="card">
        <h2>維修備註</h2>
        <textarea id="notes" placeholder="記錄修磨次數、備品編號或後續追蹤事項..."></textarea>
      </section>
    </main>

    <footer>
      小提示：手機上可使用「加入主畫面」建立捷徑，分享時直接傳這個檔案即可。
    </footer>

    <script>
      const notesField = document.getElementById("notes");
      const saveButton = document.getElementById("save");
      const resetButton = document.getElementById("reset");
      const diagnosisList = document.getElementById("diagnosisList");
      const symptomChecks = Array.from(document.querySelectorAll(".symptoms input"));

      const fields = {
        bladeModel: document.getElementById("bladeModel"),
        diameter: document.getElementById("diameter"),
        teeth: document.getElementById("teeth"),
        material: document.getElementById("material"),
        hours: document.getElementById("hours"),
        serviceDate: document.getElementById("serviceDate"),
        rpm: document.getElementById("rpm"),
        feed: document.getElementById("feed"),
        cooling: document.getElementById("cooling"),
        clamp: document.getElementById("clamp"),
      };

      const buildDiagnosis = () => {
        const items = [];
        const has = (key) => symptomChecks.find((item) => item.dataset.symptom === key)?.checked;

        if (has("vibration") || fields.clamp.value === "loose") {
          items.push({
            text: "檢查夾持與主軸跳動，確認法蘭盤、夾具是否鎖緊並重新校正。",
            type: "warning",
          });
        }
        if (has("burn") || fields.cooling.value === "dry") {
          items.push({
            text: "建議降低轉速或進給，並使用適當冷卻，避免燒焦與刀口退火。",
            type: "warning",
          });
        }
        if (has("chip")) {
          items.push({
            text: "檢查齒尖損耗並評估重磨或更換鋸片，必要時降低進給速度。",
            type: "warning",
          });
        }
        if (has("slow")) {
          items.push({
            text: "檢查鋸片磨耗程度，必要時重新研磨或更換合適齒型。",
            type: "warning",
          });
        }
        if (has("noise")) {
          items.push({
            text: "確認軸承與切削面狀況，檢查是否有異物或安裝偏移。",
            type: "warning",
          });
        }

        if (items.length === 0) {
          items.push({
            text: "目前未勾選異常症狀，建議依保養週期定期檢查與清潔鋸片。",
            type: "normal",
          });
        }

        diagnosisList.innerHTML = "";
        items.forEach((item) => {
          const div = document.createElement("div");
          div.className = `item${item.type === "warning" ? " warning" : ""}`;
          div.textContent = item.text;
          diagnosisList.appendChild(div);
        });
      };

      const loadState = () => {
        Object.keys(fields).forEach((key) => {
          const saved = localStorage.getItem(`saw-blade-${key}`);
          if (saved !== null) {
            fields[key].value = saved;
          }
        });
        notesField.value = localStorage.getItem("saw-blade-notes") || "";
        symptomChecks.forEach((item) => {
          item.checked = localStorage.getItem(`saw-blade-symptom-${item.dataset.symptom}`) === "true";
        });
        buildDiagnosis();
      };

      const saveState = () => {
        Object.keys(fields).forEach((key) => {
          localStorage.setItem(`saw-blade-${key}`, fields[key].value);
        });
        localStorage.setItem("saw-blade-notes", notesField.value.trim());
        symptomChecks.forEach((item) => {
          localStorage.setItem(`saw-blade-symptom-${item.dataset.symptom}`, item.checked);
        });
      };

      const bindAutoSave = (element) => {
        element.addEventListener("input", () => {
          buildDiagnosis();
          clearTimeout(element._timer);
          element._timer = setTimeout(saveState, 500);
        });
      };

      Object.values(fields).forEach(bindAutoSave);
      symptomChecks.forEach((item) => item.addEventListener("change", () => {
        buildDiagnosis();
        saveState();
      }));
      bindAutoSave(notesField);

      saveButton.addEventListener("click", () => {
        saveState();
        saveButton.textContent = "已儲存";
        setTimeout(() => {
          saveButton.textContent = "儲存";
        }, 1200);
      });

      resetButton.addEventListener("click", () => {
        if (confirm("確定要清除所有內容嗎？")) {
          Object.values(fields).forEach((field) => {
            field.value = "";
          });
          fields.cooling.value = "dry";
          fields.clamp.value = "stable";
          notesField.value = "";
          symptomChecks.forEach((item) => {
            item.checked = false;
          });
          buildDiagnosis();
          saveState();
        }
      });

      loadState();
    </script>
  </body>
</html>
