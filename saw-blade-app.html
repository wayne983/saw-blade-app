<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saw Blade App</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f9;
        --card: #ffffff;
        --text: #1b1b1f;
        --muted: #5f6368;
        --accent: #2b6cb0;
        --border: #e0e0e5;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1115;
          --card: #171a21;
          --text: #f2f2f2;
          --muted: #a0a4ad;
          --accent: #63b3ed;
          --border: #2a2f3a;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }

      header {
        padding: 2.5rem 1.5rem 1rem;
        text-align: center;
      }

      header h1 {
        margin: 0 0 0.25rem;
        font-size: clamp(1.75rem, 2vw + 1rem, 2.5rem);
      }

      header p {
        margin: 0 auto;
        max-width: 38rem;
        color: var(--muted);
      }

      main {
        max-width: 900px;
        margin: 0 auto;
        padding: 1.5rem;
        display: grid;
        gap: 1.25rem;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1.5rem;
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
      }

      .card h2 {
        margin-top: 0;
        font-size: 1.2rem;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.35rem 0.75rem;
        background: rgba(43, 108, 176, 0.12);
        color: var(--accent);
        border-radius: 999px;
        font-size: 0.85rem;
        font-weight: 600;
      }

      ul {
        padding-left: 1.2rem;
      }

      .checklist {
        display: grid;
        gap: 0.6rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .checklist li {
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }

      .checklist input[type="checkbox"] {
        width: 1.1rem;
        height: 1.1rem;
        accent-color: var(--accent);
      }

      .grid {
        display: grid;
        gap: 0.75rem;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        font-size: 0.9rem;
      }

      input[type="text"],
      input[type="number"],
      input[type="date"] {
        border-radius: 0.65rem;
        border: 1px solid var(--border);
        padding: 0.6rem 0.75rem;
        font-size: 1rem;
        background: transparent;
        color: inherit;
      }

      .table {
        display: grid;
        gap: 0.75rem;
      }

      .row {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 1fr;
        gap: 0.75rem;
        align-items: center;
      }

      .row.header {
        font-weight: 600;
        color: var(--muted);
      }

      .item-total {
        font-weight: 600;
        text-align: right;
      }

      .summary {
        margin-top: 1rem;
        display: grid;
        gap: 1rem;
      }

      .totals {
        display: grid;
        gap: 0.5rem;
        font-size: 1.05rem;
      }

      .totals div {
        display: flex;
        justify-content: space-between;
        border-top: 1px dashed var(--border);
        padding-top: 0.4rem;
      }

      textarea {
        width: 100%;
        min-height: 140px;
        border-radius: 0.75rem;
        border: 1px solid var(--border);
        padding: 0.75rem;
        font-size: 1rem;
        background: transparent;
        color: inherit;
        resize: vertical;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 0.75rem;
      }

      button {
        border: none;
        background: var(--accent);
        color: #fff;
        padding: 0.6rem 1rem;
        border-radius: 999px;
        font-weight: 600;
        cursor: pointer;
      }

      button.secondary {
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--accent);
      }

      footer {
        text-align: center;
        padding: 1rem 1.5rem 2rem;
        color: var(--muted);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="pill">離線可用 · 單一檔案 · 手機友善</div>
      <h1>報價單小工具</h1>
      <p>
        這是一個可直接在手機開啟的報價單範本。輸入品項與單價即可自動加總，\n        支援本機保存與快速分享。
      </p>
    </header>

    <main>
      <section class="card">
        <h2>客戶與專案資訊</h2>
        <p>填寫下方資訊，報價單會自動保存於本機。</p>
        <div class="grid">
          <label>客戶名稱
            <input id="clientName" type="text" placeholder="例：王小明" />
          </label>
          <label>專案名稱
            <input id="projectName" type="text" placeholder="例：網站改版" />
          </label>
          <label>報價日期
            <input id="quoteDate" type="date" />
          </label>
          <label>有效期限
            <input id="quoteDue" type="date" />
          </label>
        </div>
      </section>

      <section class="card">
        <h2>報價品項</h2>
        <div class="table">
          <div class="row header">
            <span>品項</span>
            <span>數量</span>
            <span>單價</span>
            <span>小計</span>
          </div>
          <div class="row">
            <input class="item-name" type="text" placeholder="例：設計費" data-item="0-name" />
            <input class="item-qty" type="number" min="0" step="1" value="1" data-item="0-qty" />
            <input class="item-price" type="number" min="0" step="1" value="0" data-item="0-price" />
            <span class="item-total" data-item="0-total">0</span>
          </div>
          <div class="row">
            <input class="item-name" type="text" placeholder="例：開發費" data-item="1-name" />
            <input class="item-qty" type="number" min="0" step="1" value="1" data-item="1-qty" />
            <input class="item-price" type="number" min="0" step="1" value="0" data-item="1-price" />
            <span class="item-total" data-item="1-total">0</span>
          </div>
          <div class="row">
            <input class="item-name" type="text" placeholder="例：維護費" data-item="2-name" />
            <input class="item-qty" type="number" min="0" step="1" value="1" data-item="2-qty" />
            <input class="item-price" type="number" min="0" step="1" value="0" data-item="2-price" />
            <span class="item-total" data-item="2-total">0</span>
          </div>
        </div>
        <div class="summary">
          <label>折扣 (%) <input id="discount" type="number" min="0" max="100" step="1" value="0" /></label>
          <label>稅率 (%) <input id="taxRate" type="number" min="0" max="100" step="1" value="5" /></label>
          <div class="totals">
            <div><span>小計</span><strong id="subtotal">0</strong></div>
            <div><span>折扣後</span><strong id="discountedTotal">0</strong></div>
            <div><span>含稅總計</span><strong id="grandTotal">0</strong></div>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>備註與付款方式</h2>
        <textarea id="notes" placeholder="輸入付款條件、交付方式或備註..."></textarea>
        <div class="actions">
          <button id="save">儲存</button>
          <button class="secondary" id="reset">清空</button>
        </div>
      </section>
    </main>

    <footer>
      小提示：手機上可使用「加入主畫面」建立捷徑，分享時直接傳這個檔案即可。
    </footer>

    <script>
      const notesField = document.getElementById("notes");
      const saveButton = document.getElementById("save");
      const resetButton = document.getElementById("reset");
      const itemRows = Array.from(document.querySelectorAll(".row")).slice(1);
      const subtotalField = document.getElementById("subtotal");
      const discountedTotalField = document.getElementById("discountedTotal");
      const grandTotalField = document.getElementById("grandTotal");
      const discountField = document.getElementById("discount");
      const taxRateField = document.getElementById("taxRate");
      const clientName = document.getElementById("clientName");
      const projectName = document.getElementById("projectName");
      const quoteDate = document.getElementById("quoteDate");
      const quoteDue = document.getElementById("quoteDue");

      const formatNumber = (value) =>
        new Intl.NumberFormat("zh-Hant-TW", { maximumFractionDigits: 0 }).format(value);

      const updateTotals = () => {
        let subtotal = 0;
        itemRows.forEach((row) => {
          const qty = Number(row.querySelector(".item-qty").value || 0);
          const price = Number(row.querySelector(".item-price").value || 0);
          const total = qty * price;
          subtotal += total;
          row.querySelector(".item-total").textContent = formatNumber(total);
        });

        const discount = Number(discountField.value || 0) / 100;
        const taxRate = Number(taxRateField.value || 0) / 100;
        const discountedTotal = subtotal * (1 - discount);
        const grandTotal = discountedTotal * (1 + taxRate);

        subtotalField.textContent = formatNumber(subtotal);
        discountedTotalField.textContent = formatNumber(discountedTotal);
        grandTotalField.textContent = formatNumber(grandTotal);
      };

      const loadState = () => {
        notesField.value = localStorage.getItem("saw-blade-notes") || "";
        clientName.value = localStorage.getItem("saw-blade-client") || "";
        projectName.value = localStorage.getItem("saw-blade-project") || "";
        quoteDate.value = localStorage.getItem("saw-blade-date") || "";
        quoteDue.value = localStorage.getItem("saw-blade-due") || "";
        discountField.value = localStorage.getItem("saw-blade-discount") || "0";
        taxRateField.value = localStorage.getItem("saw-blade-tax") || "5";

        itemRows.forEach((row, index) => {
          row.querySelector(".item-name").value =
            localStorage.getItem(`saw-blade-item-${index}-name`) || "";
          row.querySelector(".item-qty").value =
            localStorage.getItem(`saw-blade-item-${index}-qty`) || "1";
          row.querySelector(".item-price").value =
            localStorage.getItem(`saw-blade-item-${index}-price`) || "0";
        });

        updateTotals();
      };

      const saveState = () => {
        localStorage.setItem("saw-blade-notes", notesField.value.trim());
        localStorage.setItem("saw-blade-client", clientName.value.trim());
        localStorage.setItem("saw-blade-project", projectName.value.trim());
        localStorage.setItem("saw-blade-date", quoteDate.value);
        localStorage.setItem("saw-blade-due", quoteDue.value);
        localStorage.setItem("saw-blade-discount", discountField.value);
        localStorage.setItem("saw-blade-tax", taxRateField.value);

        itemRows.forEach((row, index) => {
          localStorage.setItem(
            `saw-blade-item-${index}-name`,
            row.querySelector(".item-name").value.trim()
          );
          localStorage.setItem(
            `saw-blade-item-${index}-qty`,
            row.querySelector(".item-qty").value
          );
          localStorage.setItem(
            `saw-blade-item-${index}-price`,
            row.querySelector(".item-price").value
          );
        });
      };

      saveButton.addEventListener("click", () => {
        saveState();
        saveButton.textContent = "已儲存";
        setTimeout(() => {
          saveButton.textContent = "儲存";
        }, 1200);
      });

      resetButton.addEventListener("click", () => {
        if (confirm("確定要清除所有內容嗎？")) {
          notesField.value = "";
          clientName.value = "";
          projectName.value = "";
          quoteDate.value = "";
          quoteDue.value = "";
          discountField.value = "0";
          taxRateField.value = "5";
          itemRows.forEach((row) => {
            row.querySelector(".item-name").value = "";
            row.querySelector(".item-qty").value = "1";
            row.querySelector(".item-price").value = "0";
          });
          updateTotals();
          saveState();
        }
      });

      const bindAutoSave = (element) => {
        element.addEventListener("input", () => {
          updateTotals();
          clearTimeout(element._timer);
          element._timer = setTimeout(saveState, 500);
        });
      };

      [notesField, clientName, projectName, quoteDate, quoteDue, discountField, taxRateField].forEach(
        bindAutoSave
      );

      itemRows.forEach((row) => {
        row.querySelectorAll("input").forEach(bindAutoSave);
      });

      loadState();
    </script>
  </body>
</html>
